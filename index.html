<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HostelHub | Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <img class="login-banner" src="hostel.svg" alt="HostelHub hostel building illustration">
    <div class="brand-mark">H</div>
    <p class="eyebrow">STUDENT HOSTEL PORTAL</p>
    <h1>Welcome to HostelHub</h1>
    <p class="muted">A simple place to manage your hostel stay.</p>
    <form id="loginForm" action="dashboard.html">
      <label for="regNo">Registration number</label>
      <input id="regNo" type="text" placeholder="Enter any registration number" required>
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Enter any password" required>
      <button class="primary-btn" type="submit">Login <span>→</span></button>
    </form>
    <p class="small-note">Demo login: any non-empty details will work.</p>
  </main>
</body>
</html>
